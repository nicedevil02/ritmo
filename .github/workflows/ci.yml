name: Ritmo CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_and_test:
    name: Flutter Static Analysis & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code generation up-to-date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --fatal-warnings .

      - name: Design system guard
        run: dart run tool/theme_audit.dart --check

      - name: Golden tests
        run: flutter test test/golden

      # RFC Aurora §۷.۴ — تله‌ی سوم: Golden قرمزی که بازبین نتواند ببیند،
      # فقط CI را کند می‌کند. تصویر تفاضل به‌عنوان artifact آپلود می‌شود.
      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: |
            test/golden/failures/
            test/golden/**/failures/
          if-no-files-found: ignore

      - name: Contrast tests (5 palettes x 2 brightness)
        run: flutter test test/theme/contrast_test.dart

      - name: Run unit & integration tests
        run: flutter test --coverage

  build_release:
    name: Build Market Release APKs (Bazaar & Myket)
    needs: analyze_and_test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inject Android Key Properties from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, or ANDROID_KEY_PASSWORD). Failing release build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/ritmo_release.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=ritmo_release.jks
          EOF

      - name: Build Bazaar Release APK
        run: flutter build apk --release --flavor bazaar

      - name: Build Myket Release APK
        run: flutter build apk --release --flavor myket

      - name: Upload Bazaar APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bazaar-release
          path: build/app/outputs/flutter-apk/app-bazaar-release.apk

      - name: Upload Myket APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-myket-release
          path: build/app/outputs/flutter-apk/app-myket-release.apk
